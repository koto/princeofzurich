<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Prince of Zurich</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23c8302c'/%3E%3Cpath d='M6 3h4v3h3v4h-3v3H6v-3H3V6h3z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; }
  #touch { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 8px; justify-content: space-between; pointer-events: none; user-select: none; -webkit-user-select: none; }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; pointer-events: auto; }
  #touch button { border: 2px solid #d4af37; background: rgba(20, 20, 30, 0.55); color: #fff; font: bold 18px monospace; border-radius: 10px; touch-action: none; }
  #touch button.on { background: rgba(212, 175, 55, 0.6); }
  #touch .acts { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  #touch .acts button { width: 76px; height: 50px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="screen" width="384" height="216"></canvas>
<div id="touch">
  <div class="pad">
    <span></span><button data-k="up">UP</button><span></span>
    <button data-k="left">&lt;</button><button data-k="down">DN</button><button data-k="right">&gt;</button>
  </div>
  <div class="acts">
    <button data-k="shift">SHIFT</button><button data-k="enter">OK</button>
    <button data-k="space">TIME</button><button data-k="esc">PAUSE</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
