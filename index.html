<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PRINCE OF ZURICH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23c9242b'/><rect x='6' y='3' width='4' height='10' fill='%23fff'/><rect x='3' y='6' width='10' height='4' fill='%23fff'/></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #050608;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: 'Courier New', Courier, monospace;
      color: #e8e6df;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      background: radial-gradient(circle at center, #0e1116 0%, #030406 100%);
    }
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 48px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    #touch-controls {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: auto;
      touch-action: none;
      z-index: 20;
    }
    #touch-controls.visible {
      display: block;
    }
    .touch-top-left,
    .touch-top-right {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      display: flex;
      gap: 6px;
      pointer-events: auto;
      z-index: 22;
    }
    .touch-top-left {
      left: max(10px, env(safe-area-inset-left));
    }
    .touch-top-right {
      right: max(10px, env(safe-area-inset-right));
    }
    .touch-joy-hint {
      position: absolute;
      left: max(20px, calc(env(safe-area-inset-left) + 12px));
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 1.5px dashed rgba(240, 238, 232, 0.2);
      background: rgba(12, 16, 22, 0.14);
      pointer-events: none;
      opacity: 1;
      transition: opacity 140ms ease;
      z-index: 21;
    }
    .touch-joy-hint::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      border-radius: 50%;
      border: 1px solid rgba(240, 238, 232, 0.22);
      background: rgba(240, 238, 232, 0.1);
    }
    #touch-controls.joy-active .touch-joy-hint {
      opacity: 0;
    }
    .touch-joy {
      position: fixed;
      left: 0;
      top: 0;
      width: 96px;
      height: 96px;
      margin-left: -48px;
      margin-top: -48px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
      z-index: 21;
    }
    .touch-joy.active {
      opacity: 1;
      transition: none;
    }
    .touch-joy-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(240, 238, 232, 0.34);
      background: rgba(12, 16, 22, 0.2);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.06);
    }
    .touch-joy-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      margin-top: -20px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: rgba(240, 238, 232, 0.3);
      will-change: transform;
    }
    .touch-action-wrap {
      position: absolute;
      right: max(18px, calc(env(safe-area-inset-right) + 10px));
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
      pointer-events: auto;
      z-index: 22;
    }
    .tbtn {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(15, 20, 28, 0.42);
      color: rgba(240, 238, 232, 0.88);
      font: bold 13px 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .tbtn.action {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.34);
      background: rgba(15, 20, 28, 0.38);
      flex-direction: column;
      gap: 2px;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .tbtn.action span {
      font-size: 9px;
      opacity: 0.72;
      letter-spacing: 0.08em;
      pointer-events: none;
    }
    .tbtn.small {
      width: 42px;
      height: 32px;
      border-radius: 8px;
      font-size: 10px;
    }
    .tbtn.active {
      background: rgba(201, 36, 43, 0.56);
      border-color: rgba(255, 255, 255, 0.85);
      color: #fff;
    }
    @media (orientation: portrait) {
      .touch-joy-hint {
        left: max(22px, calc(env(safe-area-inset-left) + 12px));
        bottom: max(32px, calc(env(safe-area-inset-bottom) + 18px));
      }
      .touch-action-wrap {
        right: max(22px, calc(env(safe-area-inset-right) + 12px));
        bottom: max(32px, calc(env(safe-area-inset-bottom) + 18px));
      }
    }
    @media (orientation: landscape) and (max-height: 440px) {
      .touch-joy-hint {
        width: 68px;
        height: 68px;
        left: max(14px, calc(env(safe-area-inset-left) + 8px));
        bottom: max(12px, calc(env(safe-area-inset-bottom) + 6px));
      }
      .touch-action-wrap {
        right: max(14px, calc(env(safe-area-inset-right) + 8px));
        bottom: max(12px, calc(env(safe-area-inset-bottom) + 6px));
      }
      .tbtn.action {
        width: 68px;
        height: 68px;
        font-size: 12px;
      }
      .tbtn.small {
        width: 38px;
        height: 28px;
        font-size: 10px;
      }
    }
    #fs-btn {
      position: fixed; top: calc(6px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
      z-index: 1000; padding: 6px 10px; font: 11px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em;
      color: #e8e2cf; background: rgba(13, 21, 18, .55); border: 1px solid rgba(232, 226, 207, .45); border-radius: 4px;
      opacity: .55; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    #fs-btn:hover, #fs-btn:focus-visible { opacity: 1; }
    #fs-btn[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game-canvas" width="768" height="432"></canvas>
  </div>

  <div id="touch-controls" aria-label="Touch Controls">
    <div class="touch-top-left">
      <button type="button" class="tbtn small" data-key="Escape" aria-label="Pause">II</button>
      <button type="button" class="tbtn small" data-key="KeyM" aria-label="Mute">MUTE</button>
    </div>
    <div class="touch-top-right">
      <button type="button" class="tbtn small" data-key="KeyT" aria-label="Show Time">TIME</button>
      <button type="button" class="tbtn small" data-key="KeyR" aria-label="Restart">RST</button>
    </div>
    <div class="touch-joy-hint" aria-hidden="true"></div>
    <div id="touch-joy" class="touch-joy" aria-hidden="true">
      <div id="touch-joy-ring" class="touch-joy-ring"></div>
      <div id="touch-joy-knob" class="touch-joy-knob"></div>
    </div>
    <div class="touch-action-wrap">
      <button type="button" id="touch-action" class="tbtn action" data-key="ShiftLeft" aria-label="Action / Space">ACT<span>SPACE</span></button>
    </div>
  </div>

  <button type="button" id="fs-btn" aria-label="Toggle fullscreen" title="Fullscreen (F)" hidden>FULLSCREEN</button>
  <script>
    (function () {
      var el = document.documentElement, btn = document.getElementById('fs-btn');
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (!req || !exit) return; // e.g. iPhone Safari: no element fullscreen, keep the button hidden
      btn.hidden = false;
      function active() { return document.fullscreenElement || document.webkitFullscreenElement; }
      function toggle() {
        try {
          var p = active() ? exit.call(document) : req.call(el, { navigationUI: 'hide' });
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
      function sync() { btn.textContent = active() ? 'EXIT FULLSCREEN' : 'FULLSCREEN'; }
      btn.addEventListener('click', function () { toggle(); btn.blur(); });
      window.addEventListener('keydown', function (ev) {
        if (ev.code === 'KeyF' && !ev.repeat && !ev.ctrlKey && !ev.metaKey && !ev.altKey) toggle();
      });
      document.addEventListener('fullscreenchange', sync);
      document.addEventListener('webkitfullscreenchange', sync);
    })();
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
