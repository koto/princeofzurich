<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRINCE OF ZURICH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23c9242b'/><rect x='6' y='3' width='4' height='10' fill='%23fff'/><rect x='3' y='6' width='10' height='4' fill='%23fff'/></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #050608;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #e8e6df;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0e1116 0%, #030406 100%);
    }
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 48px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    #touch-controls {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    #touch-controls.visible {
      display: block;
    }
    .touch-cluster {
      position: absolute;
      bottom: 14px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .touch-left {
      left: 14px;
      align-items: flex-end;
    }
    .touch-right {
      right: 14px;
      align-items: flex-end;
    }
    .touch-top {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .tbtn {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(15, 20, 28, 0.62);
      color: #f0eee8;
      font: bold 14px 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      backdrop-filter: blur(2px);
    }
    .tbtn.wide {
      width: 72px;
    }
    .tbtn.small {
      width: 44px;
      height: 34px;
      font-size: 11px;
    }
    .tbtn.active {
      background: rgba(210, 48, 48, 0.72);
      border-color: #fff;
    }
    .dpad-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game-canvas" width="384" height="216"></canvas>
  </div>

  <div id="touch-controls" aria-label="Touch Controls">
    <div class="touch-top">
      <button class="tbtn small" data-key="Space">TIME</button>
      <button class="tbtn small" data-key="KeyR">RST</button>
      <button class="tbtn small" data-key="KeyM">MUTE</button>
      <button class="tbtn small" data-key="Escape">II</button>
    </div>
    <div class="touch-cluster touch-left">
      <button class="tbtn" data-key="ArrowLeft">&#9664;</button>
      <div class="dpad-col">
        <button class="tbtn" data-key="ArrowUp">&#9650;</button>
        <button class="tbtn" data-key="ArrowDown">&#9660;</button>
      </div>
      <button class="tbtn" data-key="ArrowRight">&#9654;</button>
    </div>
    <div class="touch-cluster touch-right">
      <button class="tbtn wide" data-key="ShiftLeft">ACT</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
