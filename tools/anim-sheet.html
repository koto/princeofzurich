<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animation Contact Sheet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2400px;
      height: 1350px;
      overflow: hidden;
      background: #7c828a;
    }
    canvas {
      display: block;
      width: 2400px;
      height: 1350px;
    }
  </style>
</head>
<body>
  <canvas id="sheet" width="2400" height="1350"></canvas>
  <script type="module">
    import { drawCharacter } from '../src/character.js';

    const W = 2400;
    const H = 1350;
    const SCALE = 8;
    const SHOW_BONES = new URLSearchParams(window.location.search).get('bones') === '1';

    // Draw skeleton overlay from the EXACT joint positions rendered by drawCharacter:
    //   - NEAR arm & NEAR leg: bright green (#00ff44)
    //   - FAR arm & FAR leg: bright magenta (#ff22ee)
    function drawBonesOverlay(ctx, dbg) {
      if (!SHOW_BONES || !dbg || !dbg.rShoulder) return;
      const drawChain = (pts, color) => {
        ctx.strokeStyle = 'rgba(0,0,0,0.65)';
        ctx.lineWidth = 0.85;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
        ctx.stroke();

        ctx.strokeStyle = color;
        ctx.lineWidth = 0.45;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
        ctx.stroke();

        for (const pt of pts) {
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 0.72, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 0.50, 0, Math.PI * 2);
          ctx.fill();
        }
      };
      // Far limbs first (magenta), then near limbs on top (green), including hip->knee->ankle->toe foot bones!
      drawChain([dbg.lHip, dbg.lKnee, dbg.lAnkle, dbg.lToe], '#ff22ee');
      drawChain([dbg.lShoulder, dbg.lElbow, dbg.lHand], '#ff22ee');
      drawChain([dbg.rHip, dbg.rKnee, dbg.rAnkle, dbg.rToe], '#00ff44');
      drawChain([dbg.rShoulder, dbg.rElbow, dbg.rHand], '#00ff44');
    }
    // Exact in-game constants from src/player.js (do not alter gameplay values)
    const RUN_SPEED = 104;     // logical px/s
    const RUN_CYCLE_DUR = 0.42; // seconds per full 2-step cycle
    const CYCLE_DIST = RUN_SPEED * RUN_CYCLE_DUR; // 43.68 logical px per full cycle

    const canvas = document.getElementById('sheet');
    const ctx = canvas.getContext('2d');

    // Plain mid-grey studio background
    ctx.fillStyle = '#7c828a';
    ctx.fillRect(0, 0, W, H);

    const LABEL_W = 84;
    const ROW_H = H / 3; // 450px per row
    const USABLE_W = W - LABEL_W - 16;

    // Warm-up scratch canvas so spring-damped secondary motion (scarf/hair/hem)
    // reflects authentic in-game velocity rather than cold-start zero velocity.
    const scratch = document.createElement('canvas');
    scratch.width = 4;
    scratch.height = 4;
    const sctx = scratch.getContext('2d');

    function makeHero(anim, animT, opts = {}) {
      return {
        x: opts.x ?? 0,
        y: 0,
        vx: opts.vx ?? 0,
        vy: 0,
        facing: opts.facing ?? 1,
        palette: 'hero',
        grounded: true,
        alive: true,
        hasSword: true,
        swordDrawn: false,
        hurtFlash: 0,
        anim,
        animT,
        state: anim,
      };
    }

    function warmHero(ent, vx, baseTime = 2.0) {
      // Feed 12 frames of steady velocity into the entity's spring state
      const dt = 1 / 60;
      const startX = ent.x - vx * dt * 12;
      const savedX = ent.x;
      for (let k = 0; k < 12; k++) {
        ent.x = startX + vx * dt * k;
        drawCharacter(sctx, ent, baseTime - (12 - k) * dt);
      }
      ent.x = savedX;
    }

    function drawRowChrome(rowIdx, label) {
      const y0 = rowIdx * ROW_H;
      const groundY = y0 + ROW_H - 96;

      // Subtle row divider
      if (rowIdx > 0) {
        ctx.strokeStyle = 'rgba(20, 24, 30, 0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y0);
        ctx.lineTo(W, y0);
        ctx.stroke();
      }

      // Ground plane tint & crisp ground line
      ctx.fillStyle = '#6c727a';
      ctx.fillRect(0, groundY, W, y0 + ROW_H - groundY);
      ctx.strokeStyle = '#2b3036';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(W, groundY);
      ctx.stroke();

      // Row label (only 'cycle', 'travel', 'transitions')
      ctx.fillStyle = '#22262c';
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(label, 14, y0 + 18);

      return groundY;
    }

    function drawFrameNum(num, x, y) {
      ctx.fillStyle = '#22262c';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(String(num), x, y);
    }

    // -----------------------------------------------------------------------
    // ROW 1: 'cycle' — 12 evenly spaced phases of ONE full run cycle, in place
    // -----------------------------------------------------------------------
    {
      const groundY = drawRowChrome(0, 'cycle');
      const n = 12;
      const cellW = USABLE_W / n;

      for (let i = 0; i < n; i++) {
        const u = i / n;
        const cx = LABEL_W + (i + 0.5) * cellW;

        // Subtle vertical center plumb-line per frame
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, 36);
        ctx.lineTo(cx, groundY + 14);
        ctx.stroke();

        const ent = makeHero('run', u, { x: 0, vx: RUN_SPEED });
        warmHero(ent, RUN_SPEED, 2.0 + u * RUN_CYCLE_DUR);

        ctx.save();
        ctx.translate(cx, groundY);
        ctx.scale(SCALE, SCALE);
        const dbg = SHOW_BONES ? {} : null;
        drawCharacter(ctx, ent, 2.0 + u * RUN_CYCLE_DUR, dbg);
        drawBonesOverlay(ctx, dbg);
        ctx.restore();

        drawFrameNum(i + 1, cx, groundY + 20);
      }
    }

    // -----------------------------------------------------------------------
    // ROW 2: 'travel' — same 12 phases with true forward travel along ground
    //        (world-locked ground ticks + exact -3.64px prev-frame ghost so
    //        foot locking/sliding and true stride length at 104 px/s are clear)
    // -----------------------------------------------------------------------
    {
      const groundY = drawRowChrome(1, 'travel');
      const n = 12;
      const cellW = USABLE_W / n;
      const stepDxLogical = CYCLE_DIST / n; // 3.64 logical px per 1/12 cycle

      for (let i = 0; i < n; i++) {
        const u = i / n;
        const prevU = ((i - 1 + n) % n) / n;
        const cellX0 = LABEL_W + i * cellW;
        const cx = cellX0 + cellW * 0.52;
        const worldTravel = u * CYCLE_DIST; // true logical X traveled since frame 1

        // Clip ground ruler cleanly to cell
        ctx.save();
        ctx.beginPath();
        ctx.rect(cellX0 + 2, ROW_H + 2, cellW - 4, ROW_H - 4);
        ctx.clip();

        // Subtle cell separator
        if (i > 0) {
          ctx.strokeStyle = 'rgba(20, 24, 30, 0.16)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cellX0, ROW_H + 8);
          ctx.lineTo(cellX0, ROW_H + ROW_H - 8);
          ctx.stroke();
        }

        // World-space fixed ground ticks every 4 logical px (32px at 8x),
        // with bold red pins at world x = 0, +21.84 (1 step), +43.68 (2 steps)!
        // Screen X of world coordinate wx = cx + (wx - worldTravel) * SCALE
        const minWx = Math.floor((worldTravel - cellW / (2 * SCALE)) / 4) * 4 - 4;
        const maxWx = Math.ceil((worldTravel + cellW / (2 * SCALE)) / 4) * 4 + 4;
        for (let wx = minWx; wx <= maxWx; wx += 4) {
          const sx = cx + (wx - worldTravel) * SCALE;
          const major = ((wx % 16) + 16) % 16 === 0;
          ctx.strokeStyle = major ? 'rgba(30, 34, 40, 0.55)' : 'rgba(30, 34, 40, 0.25)';
          ctx.lineWidth = major ? 2 : 1;
          ctx.beginPath();
          ctx.moveTo(sx, groundY);
          ctx.lineTo(sx, groundY + (major ? 16 : 9));
          ctx.stroke();
        }

        // Stride-interval markers on ground (exact half-cycle = 21.84 logical px)
        for (const pinWx of [0, CYCLE_DIST * 0.5, CYCLE_DIST, CYCLE_DIST * 1.5]) {
          const sx = cx + (pinWx - worldTravel) * SCALE;
          if (sx >= cellX0 + 2 && sx <= cellX0 + cellW - 2) {
            ctx.fillStyle = '#c83232';
            ctx.fillRect(sx - 2, groundY - 4, 4, 18);
          }
        }

        // Previous phase ghost at exact true-travel offset (-3.64 logical px behind)
        // Makes any ground foot sliding immediately obvious between consecutive frames!
        const prevEnt = makeHero('run', prevU, { x: 0, vx: RUN_SPEED });
        warmHero(prevEnt, RUN_SPEED, 2.0 + prevU * RUN_CYCLE_DUR);
        ctx.save();
        ctx.globalAlpha = 0.26;
        ctx.translate(cx - stepDxLogical * SCALE, groundY);
        ctx.scale(SCALE, SCALE);
        drawCharacter(ctx, prevEnt, 2.0 + prevU * RUN_CYCLE_DUR);
        ctx.restore();

        // Current phase solid at world position
        const ent = makeHero('run', u, { x: 0, vx: RUN_SPEED });
        warmHero(ent, RUN_SPEED, 2.0 + u * RUN_CYCLE_DUR);
        ctx.save();
        ctx.translate(cx, groundY);
        ctx.scale(SCALE, SCALE);
        const dbg = SHOW_BONES ? {} : null;
        drawCharacter(ctx, ent, 2.0 + u * RUN_CYCLE_DUR, dbg);
        drawBonesOverlay(ctx, dbg);
        ctx.restore();

        ctx.restore(); // end cell clip

        drawFrameNum(i + 1, cx, groundY + 20);
      }
    }

    // -----------------------------------------------------------------------
    // ROW 3: 'transitions' — run_start (4), skid (3), turn (3) = 10 frames
    // -----------------------------------------------------------------------
    {
      const groundY = drawRowChrome(2, 'transitions');
      const items = [
        // Run start-up (4 frames)
        { anim: 'run_start', u: 0.00, vx: 45, num: 1, group: 0 },
        { anim: 'run_start', u: 0.33, vx: 68, num: 2, group: 0 },
        { anim: 'run_start', u: 0.67, vx: 88, num: 3, group: 0 },
        { anim: 'run_start', u: 1.00, vx: 104, num: 4, group: 0 },
        // Skid / stop (3 frames)
        { anim: 'skid', u: 0.00, vx: 95, num: 1, group: 1 },
        { anim: 'skid', u: 0.50, vx: 48, num: 2, group: 1 },
        { anim: 'skid', u: 1.00, vx: 8,  num: 3, group: 1 },
        // Turn (3 frames)
        { anim: 'turn', u: 0.00, vx: 0, num: 1, group: 2 },
        { anim: 'turn', u: 0.50, vx: 0, num: 2, group: 2 },
        { anim: 'turn', u: 1.00, vx: 0, num: 3, group: 2 },
      ];

      const n = items.length;
      const cellW = USABLE_W / n;

      for (let i = 0; i < n; i++) {
        const it = items[i];
        const cx = LABEL_W + (i + 0.5) * cellW;

        if (i > 0 && items[i - 1].group !== it.group) {
          const sepX = LABEL_W + i * cellW;
          ctx.strokeStyle = 'rgba(20, 24, 30, 0.45)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(sepX, ROW_H * 2 + 24);
          ctx.lineTo(sepX, ROW_H * 3 - 20);
          ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, ROW_H * 2 + 36);
        ctx.lineTo(cx, groundY + 14);
        ctx.stroke();

        const ent = makeHero(it.anim, it.u, { x: 0, vx: it.vx });
        warmHero(ent, it.vx, 2.0 + it.u * 0.25);

        ctx.save();
        ctx.translate(cx, groundY);
        ctx.scale(SCALE, SCALE);
        const dbg = SHOW_BONES ? {} : null;
        drawCharacter(ctx, ent, 2.0 + it.u * 0.25, dbg);
        drawBonesOverlay(ctx, dbg);
        ctx.restore();

        drawFrameNum(it.num, cx, groundY + 20);
      }
    }

    window.__ANIM_SHEET_READY__ = true;
  </script>
</body>
</html>
