<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prince of Zurich — Backdrops &amp; Music Preview</title>
  <style>
    :root {
      --bg: #0c0e13;
      --panel: #151922;
      --border: #262d3d;
      --text: #dce3f0;
      --muted: #8a95ad;
      --accent: #c92a2a;
      --accent-soft: #3a191c;
      --btn: #1e2432;
      --btn-hover: #293145;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header {
      width: 1152px;
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .swiss-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
      border-radius: 2px;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
    }

    .stage-wrap {
      background: #000;
      border: 1px solid var(--border);
      padding: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
      max-width: 100%;
      overflow-x: auto;
    }

    canvas {
      display: block;
      width: 1152px;  /* 384 * 3 */
      height: 648px;  /* 216 * 3 */
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    .controls {
      width: 1152px;
      max-width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select, input[type="number"], button {
      background: var(--btn);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    select:hover, button:hover {
      background: var(--btn-hover);
    }

    input[type="number"] {
      width: 78px;
      cursor: text;
    }

    button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    button.stop-btn {
      border-color: #6b2b2b;
      color: #f0b8b8;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    input[type="range"] {
      accent-color: var(--accent);
      width: 110px;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="swiss-badge">+</span> Prince of Zurich — Backdrops &amp; Music Preview</h1>
    <div class="meta">Internal 384×216 · Displayed 3× (1152×648) · <span id="stats">t = 0.00s</span></div>
  </header>

  <div class="stage-wrap">
    <canvas id="stage" width="384" height="216"></canvas>
  </div>

  <div class="controls">
    <section class="panel">
      <div class="panel-title">
        <span>Backdrop Selector</span>
        <span id="backdrop-label">Title — Zurich Dusk</span>
      </div>
      <div class="row">
        <label for="level-select">Scene:</label>
        <select id="level-select">
          <option value="title">Title — Zurich Skyline at Dusk</option>
          <option value="0" selected>Level 0 — Paradeplatz Bank Vaults, Zurich</option>
          <option value="1">Level 1 — Gotthard Réduit Army Bunker</option>
          <option value="2">Level 2 — CERN Accelerator Tunnel, Geneva</option>
          <option value="3">Level 3 — Jungfraujoch Ice Palace</option>
          <option value="4">Level 4 — Sphinx Observatory Summit at Night</option>
        </select>
      </div>
      <div class="row">
        <label for="seed-input">roomSeed:</label>
        <button id="seed-prev" type="button">−</button>
        <input id="seed-input" type="number" value="1" step="1" />
        <button id="seed-next" type="button">+</button>
        <button id="seed-next10" type="button">+10</button>
        <button id="toggle-anim" type="button">Pause</button>
        <label><input id="toggle-fg" type="checkbox" /> Sample foreground contrast check</label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <span>Procedural WebAudio Soundtrack</span>
        <span id="now-playing">Stopped</span>
      </div>
      <div class="row" id="track-buttons">
        <button type="button" data-track="title">title</button>
        <button type="button" data-track="level0">level0</button>
        <button type="button" data-track="level1">level1</button>
        <button type="button" data-track="level2">level2</button>
        <button type="button" data-track="level3">level3</button>
        <button type="button" data-track="level4">level4</button>
        <button type="button" data-track="duel">duel</button>
        <button type="button" data-track="death">death (stinger)</button>
        <button type="button" data-track="victory">victory (stinger)</button>
      </div>
      <div class="row">
        <button id="stop-music" class="stop-btn" type="button">Stop</button>
        <label for="volume-slider">
          Volume:
          <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7" />
          <span id="volume-val">70%</span>
        </label>
      </div>
    </section>
  </div>

  <script type="module">
    import { drawBackdrop, drawTitleBackdrop } from '../src/backdrops.js';
    import { Music } from '../src/music.js';

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const levelSelect = document.getElementById('level-select');
    const seedInput = document.getElementById('seed-input');
    const seedPrev = document.getElementById('seed-prev');
    const seedNext = document.getElementById('seed-next');
    const seedNext10 = document.getElementById('seed-next10');
    const toggleAnim = document.getElementById('toggle-anim');
    const toggleFg = document.getElementById('toggle-fg');
    const backdropLabel = document.getElementById('backdrop-label');
    const statsEl = document.getElementById('stats');

    const trackButtons = Array.from(document.querySelectorAll('#track-buttons button[data-track]'));
    const stopBtn = document.getElementById('stop-music');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeVal = document.getElementById('volume-val');
    const nowPlayingEl = document.getElementById('now-playing');

    let paused = false;
    let simTime = 0;
    let lastTs = performance.now();

    function updateBackdropLabel() {
      const opt = levelSelect.options[levelSelect.selectedIndex];
      backdropLabel.textContent = opt ? opt.textContent : '';
    }
    levelSelect.addEventListener('change', updateBackdropLabel);
    updateBackdropLabel();

    seedPrev.addEventListener('click', () => {
      seedInput.value = String((parseInt(seedInput.value, 10) || 0) - 1);
    });
    seedNext.addEventListener('click', () => {
      seedInput.value = String((parseInt(seedInput.value, 10) || 0) + 1);
    });
    seedNext10.addEventListener('click', () => {
      seedInput.value = String((parseInt(seedInput.value, 10) || 0) + 10);
    });
    toggleAnim.addEventListener('click', () => {
      paused = !paused;
      toggleAnim.textContent = paused ? 'Resume' : 'Pause';
    });

    // Optional mock platform/character silhouette overlay to verify readability
    function drawSampleForeground() {
      ctx.save();
      ctx.fillStyle = '#3d4554';
      ctx.fillRect(0, 184, 384, 32);
      ctx.fillStyle = '#6c7a94';
      ctx.fillRect(0, 184, 384, 3);
      ctx.fillStyle = '#485266';
      ctx.fillRect(140, 132, 96, 12);
      ctx.fillStyle = '#7c8ba8';
      ctx.fillRect(140, 132, 96, 2);

      // Simple Prince silhouette + red scarf highlight
      const px = 176;
      const py = 112;
      ctx.fillStyle = '#e8edf7';
      ctx.fillRect(px + 2, py, 6, 6);
      ctx.fillStyle = '#d63030';
      ctx.fillRect(px, py + 6, 10, 3);
      ctx.fillStyle = '#c5d1e8';
      ctx.fillRect(px + 2, py + 9, 6, 11);
      ctx.restore();
    }

    function frame(ts) {
      const dt = Math.min(0.1, (ts - lastTs) / 1000);
      lastTs = ts;
      if (!paused) simTime += dt;

      const mode = levelSelect.value;
      const seed = parseInt(seedInput.value, 10) || 0;
      if (mode === 'title') {
        drawTitleBackdrop(ctx, canvas.width, canvas.height, simTime);
      } else {
        drawBackdrop(ctx, parseInt(mode, 10), canvas.width, canvas.height, simTime, seed);
      }

      if (toggleFg.checked) {
        drawSampleForeground();
      }

      statsEl.textContent = `t = ${simTime.toFixed(2)}s`;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // Lazy WebAudio initialization on first user gesture
    let audioCtx = null;
    let music = null;
    let activeTrackName = null;

    function ensureMusic() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtx();
        music = new Music(audioCtx, audioCtx.destination);
        music.setVolume(parseFloat(volumeSlider.value));
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return music;
    }

    function setActiveButton(name) {
      activeTrackName = name;
      for (const btn of trackButtons) {
        btn.classList.toggle('active', btn.dataset.track === name);
      }
      nowPlayingEl.textContent = name ? `Playing: ${name}` : 'Stopped';
    }

    for (const btn of trackButtons) {
      btn.addEventListener('click', () => {
        const track = btn.dataset.track;
        const m = ensureMusic();
        m.play(track);
        setActiveButton(track);
      });
    }

    stopBtn.addEventListener('click', () => {
      if (music) music.stop();
      setActiveButton(null);
    });

    volumeSlider.addEventListener('input', () => {
      const v = parseFloat(volumeSlider.value);
      volumeVal.textContent = `${Math.round(v * 100)}%`;
      if (music) music.setVolume(v);
    });
  </script>
</body>
</html>
